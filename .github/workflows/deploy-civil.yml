name: Deploy Civil

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if it doesn't exist
        run: flyctl apps create mariage-civil-daphne-jb || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Allocate IP if needed
        run: flyctl ips allocate-v4 --app mariage-civil-daphne-jb || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy civil page
        run: flyctl deploy --config fly.civil.toml --remote-only --yes --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
